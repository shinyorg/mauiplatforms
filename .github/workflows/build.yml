name: Build

# Builds and tests the tvOS and web backends on every push and pull request.
# - Pushes to main publish preview packages to nuget.org: <NextVersion>-preview.<run number>.
# - Pushing a tag vX.Y.Z (or vX.Y.Z-beta.1 and so on) publishes exactly that version to nuget.org
#   and creates a GitHub Release with the packages and the web sample attached.
# NextVersion lives in Directory.build.props.

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - dev
    - preview
    tags:
    - 'v*'
  pull_request:
    branches:
    - main
    - dev
    - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull request runs are cancelled; a publishing run is never cut off midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: write   # required to create GitHub Releases for tags

    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Select Xcode 26.2
      run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '10.0.x'

    - name: Add .NET Workloads
      run: dotnet workload install maui tvos

    - name: Version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          version="${GITHUB_REF_NAME#v}"
          echo "args=-p:ReleaseVersion=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Release $version"
        else
          echo "args=-p:PreviewLabel=preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "release=false" >> "$GITHUB_OUTPUT"
          echo "Preview build ${{ github.run_number }}"
        fi

    - name: Build
      run: dotnet build build.slnf -m -c Release ${{ steps.version.outputs.args }}

    - name: Test
      run: dotnet test build.slnf --no-build -c Release ${{ steps.version.outputs.args }} --logger "console;verbosity=normal"

    - name: Publish Web Sample
      # No packing here: the packages were built above, and a rebuild would add -dev copies to artifacts/nuget.
      run: dotnet publish samples/SampleWeb/SampleWeb.csproj -c Release -o artifacts/SampleWeb -p:GeneratePackageOnBuild=false ${{ steps.version.outputs.args }}

    - name: Web Smoke Test (headless Chrome)
      run: node tests/browser/smoke.mjs artifacts/SampleWeb/wwwroot
      env:
        CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Web End-to-End Tests (Playwright)
      working-directory: tests/playwright
      run: |
        npm ci
        npx playwright install chromium webkit
        npx playwright test

    - name: Post Playwright Report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          tests/playwright/playwright-report
          tests/playwright/test-results

    - name: Post NuGet Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-artifacts
        path: |
          artifacts/nuget/*.nupkg
          artifacts/nuget/*.snupkg

    - name: Post Web Sample
      uses: actions/upload-artifact@v7
      with:
        name: SampleWeb
        path: 'artifacts/SampleWeb/wwwroot'

    - name: NuGet Login (OIDC)
      id: nuget-login
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || steps.version.outputs.release == 'true')
      uses: NuGet/login@v1
      with:
        user: aritchie

    - name: Publish NuGets
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || steps.version.outputs.release == 'true')
      # Symbol packages (.snupkg) next to each .nupkg are pushed with it.
      run: dotnet nuget push "artifacts/nuget/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

    - name: Create GitHub Release
      if: steps.version.outputs.release == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        (cd artifacts/SampleWeb && zip -qr ../SampleWeb-wwwroot.zip wwwroot)
        flags=(--title "$GITHUB_REF_NAME" --generate-notes)
        if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
        gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
          artifacts/nuget/*.nupkg artifacts/nuget/*.snupkg artifacts/SampleWeb-wwwroot.zip
