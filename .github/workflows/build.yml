name: Build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches:
    - main
    - dev
    - preview
    - v*
  pull_request:
    branches:
    - main
    - dev
    - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: read

    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Select Xcode 26.2
      run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '10.0.x'

    - name: Add .NET Workloads
      run: dotnet workload install maui tvos

    - name: Build
      run: dotnet build build.slnf -m -property:Configuration=Release

    - name: Test
      run: dotnet test build.slnf --no-build -property:Configuration=Release --logger "console;verbosity=normal" || true

    - name: Publish Web Sample
      run: dotnet publish samples/SampleWeb/SampleWeb.csproj -c Release -o artifacts/SampleWeb

    - name: Web Smoke Test (headless Chrome)
      run: node tests/browser/smoke.mjs artifacts/SampleWeb/wwwroot
      env:
        CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Web End-to-End Tests (Playwright)
      working-directory: tests/playwright
      run: |
        npm ci
        npx playwright install chromium webkit
        npx playwright test

    - name: Post Playwright Report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          tests/playwright/playwright-report
          tests/playwright/test-results

    - name: Post NuGet Artifacts
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v7
      with:
        name: nuget-artifacts
        path: '**/*.nupkg'

    - name: Post Web Sample
      uses: actions/upload-artifact@v7
      with:
        name: SampleWeb
        path: 'artifacts/SampleWeb/wwwroot'

    - name: NuGet Login (OIDC)
      id: nuget-login
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
      uses: NuGet/login@v1
      with:
        user: aritchie

    - name: Publish NuGets
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
      run: dotnet nuget push **\*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate