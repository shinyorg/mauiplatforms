name: Build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches:
    - main
    - dev
    - preview
    - v*
  pull_request:
    branches:
    - main
    - dev
    - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: read

    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0

    - name: Select Xcode 26.2
      run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
          dotnet-version: '10.0.x'

    - name: Add .NET Workloads
      run: dotnet workload install maui tvos macos

    - name: Build
      run: dotnet build build.slnf -m -property:Configuration=Release

    - name: Build Sample App (arm64)
      run: dotnet build samples/SampleMac/SampleMac.csproj -c Release -p:GeneratePackageOnBuild=false -r osx-arm64

    - name: Build Sample App (x64)
      run: dotnet build samples/SampleMac/SampleMac.csproj -c Release -p:GeneratePackageOnBuild=false -r osx-x64

    - name: Test
      run: dotnet test build.slnf --no-build -property:Configuration=Release --logger "console;verbosity=normal" || true

    - name: Post NuGet Artifacts
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-artifacts
        path: '**/*.nupkg'

    - name: Post Sample App
      uses: actions/upload-artifact@v4
      with:
        name: SampleMac
        path: 'samples/SampleMac/bin/Release/net10.0-macos/**/*.app'

    - name: NuGet Login (OIDC)
      id: nuget-login
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
      uses: NuGet/login@v1
      with:
        user: aritchie

    - name: Publish NuGets
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
      run: dotnet nuget push **\*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate